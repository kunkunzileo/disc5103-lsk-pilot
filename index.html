*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:16px/1.55 "Segoe UI","Microsoft YaHei",sans-serif}

<script>(() => {
  "use strict";
  const $ = id => document.getElementById(id);
  const ns = "http://www.w3.org/2000/svg";
  const radius = 0.35;  // One simulated non-traversable patch, in model metres.
  const palette = {route:"#007865", alternate:"#2459a4", room:"#267357", block:"#b23f2e", ink:"#183b30"};
  const metres = v => v.toFixed(2) + " m";
  const gap = (p,q) => Math.hypot(p[0]-q[0],p[1]-q[1]);
  const finitePoint = p => Array.isArray(p) && p.length===2 && p.every(Number.isFinite);
  function project(p,a,b) {
    const dx=b[0]-a[0],dy=b[1]-a[1],square=dx*dx+dy*dy;
    const t=square ? Math.max(0,Math.min(1,((p[0]-a[0])*dx+(p[1]-a[1])*dy)/square)) : 0;
    return [a[0]+t*dx,a[1]+t*dy];
  }
  function closest(p,line) {
    let q=line[0], distance=Infinity;
    for (let i=1;i<line.length;i++) {
      const pick=project(p,line[i-1],line[i]),d=gap(p,pick);
      if(d<distance){q=pick;distance=d;}
    }
    return {xy:q,distance};
  }
  function along(line,fraction) {
    const lengths=line.slice(1).map((p,i)=>gap(p,line[i]));
    let remaining=lengths.reduce((a,b)=>a+b,0)*fraction;
    for(let i=0;i<lengths.length;i++) {
      if(remaining<=lengths[i] && lengths[i]>0) {
        const t=remaining/lengths[i];
        return line[i].map((v,j)=>v+(line[i+1][j]-v)*t);
      }
      remaining-=lengths[i];
    }
    return line[line.length-1];
  }
  function allowed(route,block) {
    if (!block) return true;
    if (block.kind==="door") return route.endpoint_id!==block.endpoint_id;
    return closest(block.xy,route.xy_m).distance > radius + .001;
  }
  function inside(p,polygon) {
    let contained=false;
    for(let i=0,j=polygon.length-1;i<polygon.length;j=i++){
      const a=polygon[i],b=polygon[j];
      if((a[1]>p[1])!==(b[1]>p[1]) && p[0]<(b[0]-a[0])*(p[1]-a[1])/(b[1]-a[1])+a[0])contained=!contained;
    }
    return contained;
  }
  function roomDetour(route,block,walk,polygon) {
    if(!walk||block?.kind!=="point"||!inside(block.xy,polygon) || gap(route.xy_m[1],walk.door)>.04)return null;
    const points=walk.points,waiting=new Set(Object.keys(points)),dist={A:0},parent={};
    while(waiting.size){
      let u=null;
      for(const v of waiting)if(v in dist&&(u===null||dist[v]<dist[u]))u=v;
      if(u===null||u==="B")break;
      waiting.delete(u);
      for(const [i,j] of walk.links){
        const v=i===u?j:j===u?i:null;
        if(!waiting.has(v)||closest(block.xy,[points[u],points[v]]).distance<=radius+.001)continue;
        const candidate=dist[u]+gap(points[u],points[v]);
        if(!(v in dist)||candidate<dist[v]){dist[v]=candidate;parent[v]=u;}
      }
    }
    if(!("B" in dist))return null;
    const interior=[];
    for(let v="B";v;v=parent[v])interior.unshift(points[v]);
    const line=[route.xy_m[0],...interior,...route.xy_m.slice(1)];
    if(closest(block.xy,line).distance<=radius+.001)return null;
    const length=line.slice(1).reduce((d,p,i)=>d+gap(line[i],p),0);
    return {...route,xy_m:line,distance_m:length,local_detour:true};
  }
  function svgNode(tag,attrs={},text) {
    const n=document.createElementNS(ns,tag);
    Object.entries(attrs).forEach(([k,v])=>n.setAttribute(k,String(v)));
    if(text!==undefined) n.textContent=text;
    return n;
  }
  function button(node,name,onClick) {
    node.setAttribute("role","button");node.setAttribute("tabindex","0");node.setAttribute("aria-label",name);
    node.addEventListener("click",onClick);
    node.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();onClick(e);}});
    return node;
  }
  function usable(map,rooms) {
    if (!map || map.source!=="doorway_checked_plan_v1" || !Array.isArray(map.bounds_m) || map.bounds_m.length!==4 || !map.bounds_m.every(Number.isFinite) ||
        map.bounds_m[2]<=map.bounds_m[0] || map.bounds_m[3]<=map.bounds_m[1] || typeof map.image!=="string" ||
        !/^data:image\/png;base64,[A-Za-z0-9+/=]+$/.test(map.image) || !Array.isArray(map.rooms) || map.rooms.length!==2 ||
        !Array.isArray(map.routes) || map.routes.length!==4) return false;
    return map.rooms.every(r=>{
      if(!r||typeof r.room_label!=="string")return false;
      const ref=rooms.find(other=>other.room_label===r.room_label);
      const routes=map.routes.filter(v=>v?.room_label===r.room_label);
      const walk=map.room_walks?.[r.room_label];
      if(walk && (!finitePoint(walk.door)||!walk.points||!finitePoint(walk.points.A)||!finitePoint(walk.points.B)||
        Object.keys(walk.points).length>20||!Array.isArray(walk.links)||walk.links.length>100||
        !walk.links.every(pair=>Array.isArray(pair)&&pair.length===2&&pair.every(k=>Object.hasOwn(walk.points,k)&&finitePoint(walk.points[k])))))return false;
      return ref?.alternate && finitePoint(r.origin_m) && Array.isArray(r.polygon_m) && r.polygon_m.length>=3 && r.polygon_m.length<=2000 &&
        r.polygon_m.every(finitePoint) && [ref,ref.alternate].every(target=>routes.some(path=>
          path.endpoint_id===target.endpoint_id && Math.abs(path.distance_m-target.distance_m)<.011 &&
          Array.isArray(path.xy_m) && path.xy_m.length>=2 && path.xy_m.length<=2000 && path.xy_m.every(finitePoint) &&
          gap(path.xy_m[0],r.origin_m)<.06));
    });
  }
  window.createPilotPlan = function(onSelect,onChange) {
    const panel=$("floor"),svg=$("floor-svg");
    let map=null,rooms=[],room=null,outside=null,active=null,block=null,zoom=1,pan=[0,0],drag=null,ignoreClick=false;
    let transform=null;
    function baseRoutes() {
      return room ? map.routes.filter(r=>r.room_label===room.room_label).slice().sort((a,b)=>a.distance_m-b.distance_m) : [];
    }
    function label(route) {
      const item=room.endpoint_id===route.endpoint_id?room:room.alternate;
      return item.endpoint_label || item.endpoint_id;
    }
    function sync(next) {
      block=next;
      const area=map.rooms.find(r=>r.room_label===room?.room_label);
      const available=baseRoutes().map(r=>allowed(r,block)?r:roomDetour(r,block,map.room_walks?.[room.room_label],area.polygon_m));
      active=available.filter(Boolean).sort((a,b)=>a.distance_m-b.distance_m)[0] || null;
      onChange({blocked:Boolean(block),route:active,unknown:!!room&&!active,alternate:!!active&&active.endpoint_id!==room.endpoint_id});
      draw();
    }
    function setRoom(ref) {
      if(room?.room_label!==ref?.room_label){zoom=1;pan=[0,0];}
      room=map && ref && map.rooms.some(r=>r.room_label===ref.room_label) ? ref : null;
      outside=ref&&!room?ref:null;
      block=null;active=room?baseRoutes()[0]:null;
      $("floor-range").value=50;
      draw();
    }
    function load(d) {
      rooms=d.rooms;
      map=usable(d.pilot_map,rooms)?d.pilot_map:null;
      zoom=1;pan=[0,0];room=null;outside=null;block=null;active=null;
      panel.hidden=!map;
      $("floor-rooms").replaceChildren();
      if(!map)return;
      const [x0,y0,x1,y1]=map.bounds_m;
      $("floor-stage").style.setProperty("--plan-aspect",String((x1-x0)/(y1-y0)));
      for(const r of map.rooms) {
        const b=document.createElement("button");b.type="button";b.textContent=r.room_label;
        b.onclick=()=>onSelect(r.room_label);$("floor-rooms").append(b);
      }
      draw();
    }
    function addPath(fragment,route,color,ghost=false) {
      const pts=route.xy_m.map(transform.screen).map(p=>p.join(",")).join(" ");
      const attrs={points:pts,fill:"none","stroke-linecap":"round","stroke-linejoin":"round","pointer-events":"none"};
      if(ghost) {
        fragment.append(svgNode("polyline",{...attrs,stroke:"#6b7881","stroke-width":2.5,"stroke-dasharray":"5 6",opacity:.78}));
        return;
      }
      fragment.append(svgNode("polyline",{...attrs,stroke:"white","stroke-width":8}),
        svgNode("polyline",{...attrs,stroke:color,"stroke-width":4.5,"data-active-path":route.endpoint_id}));
      const hit=svgNode("polyline",{points:pts,fill:"none",stroke:"transparent","stroke-width":19,"pointer-events":"stroke",
        "aria-label":"在当前路线上点选不通位置",style:"cursor:crosshair","data-route-hit":"true"});
      hit.addEventListener("click",e=>{
        if(ignoreClick)return;
        const rect=svg.getBoundingClientRect(),p=transform.world([e.clientX-rect.left,e.clientY-rect.top]);
        sync({kind:"point",xy:closest(p,route.xy_m).xy});
      });
      fragment.append(hit);
      const start=transform.screen(route.xy_m[0]),end=transform.screen(route.xy_m.at(-1));
      fragment.append(svgNode("circle",{cx:start[0],cy:start[1],r:5.5,fill:color,stroke:"white","stroke-width":2,"pointer-events":"none"}));
      const marker=svgNode("g",{"data-map-exit":route.endpoint_id});
      const endpointName=label(route),labelWidth=Math.max(46,endpointName.length*13+12);
      const labelX=Math.max(3,Math.min(svg.clientWidth-labelWidth-3,end[0]-labelWidth/2));
      const labelY=end[1]>28?end[1]-26:end[1]+10;
      marker.append(svgNode("rect",{x:end[0]-14,y:end[1]-14,width:28,height:28,fill:"transparent"}),
        svgNode("rect",{x:labelX,y:labelY,width:labelWidth,height:17,rx:4,fill:"white","fill-opacity":.95,stroke:color,"stroke-width":1}),
        svgNode("text",{x:labelX+labelWidth/2,y:labelY+9,"dominant-baseline":"central","text-anchor":"middle","font-size":12,fill:color,"font-weight":700},endpointName),
        svgNode("rect",{x:end[0]-6.5,y:end[1]-6.5,width:13,height:13,rx:2,fill:color,stroke:"white","stroke-width":2}));
      fragment.append(button(marker,"标记出口暂时不通："+label(route),()=>{if(!ignoreClick)sync({kind:"door",endpoint_id:route.endpoint_id,xy:route.xy_m.at(-1)});}));
    }
    function draw() {
      if (!map || panel.hidden) return;
      const rect=svg.getBoundingClientRect(),w=rect.width,h=rect.height;
      if(!w||!h)return;
      const [xmin,ymin,xmax,ymax]=map.bounds_m, dx=xmax-xmin,dy=ymax-ymin;
      const s=Math.min((w-22)/dx,(h-22)/dy)*zoom;
      const cx=(xmin+xmax)/2,cy=(ymin+ymax)/2;
      const screen=([x,y])=>[w/2+pan[0]+(x-cx)*s,h/2+pan[1]-(y-cy)*s];
      const world=([x,y])=>[cx+(x-w/2-pan[0])/s,cy-(y-h/2-pan[1])/s];
      transform={screen,world};
      svg.setAttribute("viewBox",[0,0,w,h].join(" "));
      svg.style.touchAction=zoom>1?"none":"pan-y";
      const f=document.createDocumentFragment(), corner=screen([xmin,ymax]);
      f.append(svgNode("image",{href:map.image,x:corner[0],y:corner[1],width:dx*s,height:dy*s,preserveAspectRatio:"none","pointer-events":"none"}));
      const ordered=map.rooms.slice().sort((a,b)=>a.origin_m[0]-b.origin_m[0]);
      for(const r of ordered) {
        const selected=r.room_label===room?.room_label;
        const polygon=svgNode("polygon",{points:r.polygon_m.map(screen).map(p=>p.join(",")).join(" "),fill:selected?"#72c397":"#b5ddc4","fill-opacity":selected ? .72 : .58,stroke:palette.room,"stroke-width":selected?2.8:1.6,"data-room-map":r.room_label,"aria-pressed":String(selected)});
        f.append(button(polygon,"选择房间 "+r.room_label,()=>{if(!ignoreClick)onSelect(r.room_label);}));
      }
      const changed=active && (active.local_detour || active.endpoint_id!==room.endpoint_id);
      panel.querySelector(".floor-key-line").style.background=changed?palette.alternate:palette.route;
      if(changed&&block)addPath(f,baseRoutes()[0],null,true);
      if(active)addPath(f,active,changed?palette.alternate:palette.route);
      if(block) {
        const [x,y]=screen(block.xy),g=svgNode("g",{"data-closure":block.kind,"pointer-events":"none"});
        if(block.kind==="point")g.append(svgNode("circle",{cx:x,cy:y,r:radius*s,stroke:palette.block,fill:"#f5a38b","fill-opacity":.38,"stroke-width":1.5}));
        g.append(svgNode("circle",{cx:x,cy:y,r:8.5,fill:palette.block,stroke:"white","stroke-width":1.5}),
          svgNode("path",{d:"M "+(x-3.4)+" "+(y-3.4)+" l 6.8 6.8 m -6.8 0 l 6.8 -6.8",stroke:"white","stroke-width":1.8}));
        f.append(g);
      }
      for(const [i,r] of ordered.entries()) {
        const [x,y]=screen(r.origin_m),side=i===0?-1:1;
        const lx=Math.max(28,Math.min(w-28,x+side*32)),ly=Math.max(15,Math.min(h-15,y-24+i*4));
        const g=svgNode("g",{"data-room-label":r.room_label});
        g.append(svgNode("line",{x1:x,y1:y,x2:lx,y2:ly,stroke:palette.room,"stroke-width":1,"pointer-events":"none"}),
          svgNode("rect",{x:lx-26,y:ly-15,width:52,height:30,rx:7,fill:"transparent"}),
          svgNode("rect",{x:lx-23,y:ly-10,width:46,height:20,rx:5,fill:r.room_label===room?.room_label?"#123f32":"#37725b",stroke:"white","stroke-width":1.3}),
          svgNode("text",{x:lx,y:ly,class:"floor-chip"},r.room_label));
        f.append(button(g,"切换起点 "+r.room_label,()=>{if(!ignoreClick)onSelect(r.room_label);}));
      }
      svg.replaceChildren(f);
      $("floor-minus").disabled=zoom<=1;$("floor-plus").disabled=zoom>=3;
      $("floor-range-tools").hidden=!active;$("floor-reset").hidden=!block;
      $("floor-hint").textContent=room?"点另一间房可更换起点；点彩色路线或出口可标记不通。":"点图中填色房间或房号选择起点。";
      $("floor-title").textContent=active?room.room_label+" → "+label(active)+" · "+metres(active.distance_m):room?room.room_label+" · 该位置的绕行待核":"请选择起点";
      if(!room) $("floor-status").textContent="显示两间试点房间的实际 Revit 平面。";
      else if(!active) $("floor-status").textContent="该房间的两条已核路线均经过标记范围。解除标记可恢复常态路线。";
      else if(block && !changed) $("floor-status").textContent="该标记未影响常态路线，仍可走原路线。";
      else if(block) $("floor-status").textContent=(block.kind==="point"?(active.local_detour?"已绕开房间内的模拟占位。":"已避开这处直径 0.70 m 的模拟占位。"):"已改走另一个出口。")+
        "原路线 "+metres(room.distance_m)+"，变化 "+(active.distance_m>=room.distance_m?"+":"")+metres(active.distance_m-room.distance_m)+"。虚线表示原路线。";
      else $("floor-status").textContent="显示两个已核门厅方案中较短的一条。方块是门槛，圆点是起点。";
      if(outside){$("floor-title").textContent=outside.room_label+" · 结果见下方";$("floor-status").textContent="本图覆盖两个试点房间。点图中的房间可切换起点。";}
      updateStation();
    }
    function updateStation(){if(active)$("floor-station").textContent=metres(active.distance_m*Number($("floor-range").value)/100);}
    function setZoom(value){
      const previous=zoom;zoom=Math.min(3,Math.max(1,value));
      if(zoom===1)pan=[0,0];else pan=pan.map(x=>x*(zoom/previous));draw();
    }
    $("floor-plus").onclick=()=>setZoom(zoom*1.5);$("floor-minus").onclick=()=>setZoom(zoom/1.5);$("floor-fit").onclick=()=>setZoom(1);
    $("floor-reset").onclick=()=>sync(null);$("floor-range").oninput=updateStation;
    $("floor-mark").onclick=()=>{if(active)sync({kind:"point",xy:along(active.xy_m,Number($("floor-range").value)/100)});};
    svg.addEventListener("pointerdown",e=>{ignoreClick=false;if(zoom>1&&e.button===0)drag={id:e.pointerId,x:e.clientX,y:e.clientY,pan:pan.slice()};});
    svg.addEventListener("pointermove",e=>{
      if(!drag||e.pointerId!==drag.id)return;
      const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
      if(Math.hypot(dx,dy)>5||ignoreClick){ignoreClick=true;svg.setPointerCapture(e.pointerId);
        const rect=svg.getBoundingClientRect();
        pan=[Math.max(-rect.width*(zoom-.5)/2,Math.min(rect.width*(zoom-.5)/2,drag.pan[0]+dx)),Math.max(-rect.height*(zoom-.5)/2,Math.min(rect.height*(zoom-.5)/2,drag.pan[1]+dy))];draw();}
    });
    svg.addEventListener("pointerup",()=>{drag=null;setTimeout(()=>{ignoreClick=false;},0);});
    svg.addEventListener("pointercancel",()=>{drag=null;ignoreClick=false;});
    new ResizeObserver(()=>draw()).observe(svg);
    return {load,setRoom,hasRoom:()=>Boolean(room),markExit(){if(active)sync({kind:"door",endpoint_id:active.endpoint_id,xy:active.xy_m.at(-1)});},restore:()=>sync(null)};
  };
})();
</script><script>
const data = JSON.parse(document.getElementById("embedded").textContent);
const choose = label => plan.setRoom(data.rooms.find(room => room.room_label === label));
const plan = window.createPilotPlan(choose, () => {});
plan.load(data);
choose(data.rooms[0].room_label);
</script></body></html>
